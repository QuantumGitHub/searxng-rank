use_default_settings: true
general:
  instance_name: "searxng-rank"
  debug: false
  privacypolicy_url: false
  contact_url: false
  enable_metrics: false
search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json
server:
  secret_key: "${SEARXNG_SECRET_KEY:-secretkey}"
  limiter: false
  image_proxy: false
ui:
  static_use_hash: true
  default_theme: simple
  default_locale: "en"

engines:
  - name: google
    engine: google
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    disabled: false

  - name: bing
    engine: bing
    disabled: false

  - name: wikipedia
    engine: wikipedia
    disabled: false

  - name: wikidata
    engine: wikidata
    disabled: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 30.0
  useragent_suffix: ""
