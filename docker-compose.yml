services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=https://${SEARXNG_HOSTNAME:-localhost}/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-secretkey}
    volumes:
      # Single config dir (upstream pattern): ./settings/settings.yml is the
      # partial settings file merged over image defaults via
      # `use_default_settings: true`. A previous revision mounted a file bind
      # AND a named volume on overlapping paths (/etc/searxng/settings.yml +
      # /etc/searxng), which is order-dependent and fragile.
      - ./settings:/etc/searxng:rw
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  searxng-rank-mcp:
    build: .
    container_name: searxng-rank-mcp
    ports:
      - "8000:8000"
    environment:
      # Reach the SearXNG above by compose service name (same default network).
      - SEARXNG_SERVICE_HOST=searxng
      - SEARXNG_SERVICE_PORT=8080
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    depends_on:
      - searxng
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-data:
