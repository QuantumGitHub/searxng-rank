services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=https://${SEARXNG_HOSTNAME:-localhost}/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-secretkey}
    volumes:
      - ./settings/searxng.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/etc/searxng
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  searxng-rank-mcp:
    build: .
    container_name: searxng-rank-mcp
    ports:
      - "8000:8000"
    environment:
      # Reach the SearXNG above by compose service name (same default network).
      - SEARXNG_SERVICE_HOST=searxng
      - SEARXNG_SERVICE_PORT=8080
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    depends_on:
      - searxng
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  searxng-data:
  qdrant-data:
